<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QAIM Platform - المنصة العالمية الأولى</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000000; color: #ffffff; overflow: hidden; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 60px; }
        .page.active { display: block; }

        /* شاشة البداية السريعة */
        #splashScreen { position: fixed; inset: 0; background: #000000; z-index: 6000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
        .splash-logo { font-size: 50px; font-weight: 900; color: #38bdf8; display: flex; align-items: center; gap: 10px; }

        /* الشريط العلوي */
        .top-header { position: absolute; top: 10px; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .top-tabs { display: flex; gap: 15px; font-size: 15px; font-weight: bold; color: rgba(255,255,255,0.6); cursor: pointer; }
        .top-tabs span.active { color: #fff; font-size: 16px; border-bottom: 2px solid #fff; }

        /* الخلاصة الخفيفة */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: #000; }
        .card-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 15%, transparent 50%); z-index: 1; }
        .card-content { position: relative; z-index: 2; margin-bottom: 65px; }

        /* الأزرار الجانبية */
        .side-actions { position: absolute; left: 12px; bottom: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 3; align-items: center; }
        .action-btn { background: rgba(255,255,255,0.15); border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; }
        .action-text { font-size: 9px; margin-top: 2px; }

        /* الملف الشخصي */
        .profile-container { padding: 15px; background: #000; }
        .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; }
        .profile-grid-item { position: relative; height: 150px; background: #111; overflow: hidden; }
        .profile-grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-post-btn { position: absolute; top: 6px; right: 6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; z-index: 5; }

        /* استوديو النشر */
        #postEditorModal, #uploadModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #121212; border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; }
        .form-input { width: 100%; padding: 10px; background: #000; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .primary-btn { background: #38bdf8; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        /* الشريط السفلي */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: #888; background: none; border: none; font-size: 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; flex: 1; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .plus-btn { background: #fff; color: #000; width: 36px; height: 24px; border-radius: 6px; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

    <!-- شاشة البداية السريعة -->
    <div id="splashScreen">
        <div class="splash-logo">⚔️ QAIM</div>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="page-home" class="page active">
        <div class="top-header">
            <div style="font-size: 12px; color:#ef4444; font-weight:bold;">🔴 LIVE</div>
            <div class="top-tabs">
                <span onclick="switchTab(this)">المجتمع</span>
                <span onclick="switchTab(this)">أتابعه</span>
                <span class="active" onclick="switchTab(this)">لك</span>
            </div>
            <span onclick="switchPage('explore')" style="font-size:18px; cursor:pointer;">🔍</span>
        </div>
        <div class="feed" id="mainFeedContainer"></div>
    </div>

    <!-- إكسبلور -->
    <div id="page-explore" class="page">
        <div style="padding: 20px;">
            <h3 style="color:#38bdf8; margin-bottom:10px;">🔍 الإكسبلور والبحث</h3>
            <input type="text" class="form-input" placeholder="ابحث في المنصة..." onkeyup="searchPosts(this.value)">
            <div id="exploreResults" style="margin-top:15px; display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <!-- الملف الشخصي -->
    <div id="page-profile" class="page">
        <div class="profile-container">
            <div style="text-align: center; margin-top: 20px;">
                <div id="profileAvatar" style="width: 70px; height: 70px; background: #38bdf8; color:#000; border-radius: 50%; margin: 0 auto 10px; display:flex; justify-content:center; align-items:center; font-size:24px; font-weight:bold;">👤</div>
                <h3 id="profileNameDisplay">مستخدم المنصة</h3>
                <p id="profileUserTag" style="font-size: 11px; color: #888;">@qaim_user</p>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <span style="font-size: 12px; color: #888;">منشوراتك العامة:</span>
                <button onclick="toggleSelectMode()" class="primary-btn" style="width:auto; padding:4px 10px; font-size:10px; background:#222; color:#38bdf8;">تحديد للحذف 🗑️</button>
            </div>
            <div class="profile-grid" id="profileGridContainer"></div>
        </div>
    </div>

    <!-- استوديو النشر (مثل تيك توك) -->
    <div id="postEditorModal">
        <div class="modal-box">
            <h3 style="color:#38bdf8; font-size:14px; text-align:center;">✨ إعداد المنشور ونشره للعام</h3>
            <div id="editorPreview" style="height:140px; background:#000; border-radius:8px; overflow:hidden;"></div>
            <input type="text" id="editorCaption" class="form-input" placeholder="اكتب وصفاً أو هاشتاغ...">
            <button class="primary-btn" onclick="publishPostNow()">نشر الآن للعام 🚀</button>
            <button onclick="document.getElementById('postEditorModal').style.display='none'" style="background:none; border:none; color:#ef4444; font-size:11px; cursor:pointer; text-align:center;">إلغاء</button>
        </div>
    </div>

    <!-- رفع الوسائط -->
    <input type="file" id="deviceFilePicker" accept="image/*,video/*" style="display:none;" onchange="handleFileSelected(this)">

    <!-- الشريط السفلي -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchPage('home', this)"><span>🏠</span><span>الرئيسية</span></button>
        <button class="nav-item" onclick="switchPage('explore', this)"><span>🔍</span><span>إكسبلور</span></button>
        <div class="plus-btn" onclick="document.getElementById('deviceFilePicker').click()">+</div>
        <button class="nav-item" onclick="switchPage('profile', this)"><span>👤</span><span>الملف الشخصي</span></button>
    </nav>

    <script>
        let posts = [
            { id: 1, user: "بغداد لايف", title: "انطلاق منصة المنهج القويم ⚔️", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", type: "video" }
        ];
        let tempMedia = null;

        window.onload = function() {
            setTimeout(() => {
                let splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }, 1000);

            let saved = localStorage.getItem('qaim_posts_light');
            if(saved) { try { posts = JSON.parse(saved); } catch(e){} }
            renderFeed();
            renderProfile();
        };

        function renderFeed() {
            let container = document.getElementById('mainFeedContainer');
            container.innerHTML = '';
            posts.forEach(p => {
                let card = document.createElement('div');
                card.className = 'card';
                let mediaTag = p.type === 'image' ? `<img class="card-media" src="${p.url}">` : `<video class="card-media" src="${p.url}" autoplay loop muted playsinline></video>`;
                card.innerHTML = `
                    ${mediaTag}
                    <div class="card-overlay"></div>
                    <div class="side-actions">
                        <button class="action-btn" onclick="this.classList.toggle('liked')">❤️<span class="action-text">12k</span></button>
                        <button class="action-btn" onclick="alert('مشاركة ناجحة!')">🚀<span class="action-text">مشاركة</span></button>
                    </div>
                    <div class="card-content">
                        <h4 style="font-size:14px; font-weight:bold;">@${p.user}</h4>
                        <p style="font-size:11px; color:#ddd; margin-top:3px;">${p.title}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleFileSelected(input) {
            if(input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    tempMedia = { url: e.target.result, type: file.type.includes('video') ? 'video' : 'image' };
                    let prev = document.getElementById('editorPreview');
                    prev.innerHTML = tempMedia.type === 'image' ? `<img src="${tempMedia.url}" style="width:100%;height:100%;object-fit:cover;">` : `<video src="${tempMedia.url}" style="width:100%;height:100%;object-fit:cover;" autoplay muted></video>`;
                    document.getElementById('postEditorModal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function publishPostNow() {
            let caption = document.getElementById('editorCaption').value.trim() || "منشور عام جديد ✨";
            let newPost = { id: Date.now(), user: "حيدر_العگاب", title: caption, url: tempMedia.url, type: tempMedia.type };
            posts.unshift(newPost);
            localStorage.setItem('qaim_posts_light', JSON.stringify(posts));
            document.getElementById('postEditorModal').style.display = 'none';
            renderFeed();
            renderProfile();
            switchPage('home');
            alert('تم النشر بنجاح ليظهر للعام!');
        }

        function renderProfile() {
            let grid = document.getElementById('profileGridContainer');
            grid.innerHTML = '';
            posts.forEach(p => {
                let item = document.createElement('div');
                item.className = 'profile-grid-item';
                let imgContent = p.type === 'image' ? `<img src="${p.url}">` : `<img src="https://images.unsplash.com/photo-1542816417-0983cbe82752?auto=format&fit=crop&w=300&q=80">`;
                item.innerHTML = `
                    ${imgContent}
                    <button class="delete-post-btn" onclick="deletePost(${p.id})">✕</button>
                    <div style="position:absolute; bottom:4px; right:4px; font-size:9px; color:#fff; text-shadow:0 1px 2px #000;">⭐ ${p.title}</div>
                `;
                grid.appendChild(item);
            });
        }

        function deletePost(id) {
            if(confirm('حذف هذا المنشور نهائياً؟')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('qaim_posts_light', JSON.stringify(posts));
                renderFeed();
                renderProfile();
                alert('تم الحذف بنجاح!');
            }
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(btn) btn.classList.add('active');
            if(pageId === 'profile') renderProfile();
        }

        function switchTab(el) {
            document.querySelectorAll('.top-tabs span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            renderFeed();
        }

        function searchPosts(q) {
            let res = document.getElementById('exploreResults');
            res.innerHTML = '';
            let filtered = posts.filter(p => p.title.includes(q) || p.user.includes(q));
            filtered.forEach(p => {
                let div = document.createElement('div');
                div.style.padding = "10px"; div.style.background = "#1e293b"; div.style.borderRadius = "8px"; div.style.fontSize = "12px";
                div.innerHTML = `<b>@${p.user}</b>: ${p.title}`;
                res.appendChild(div);
            });
        }
    </script>
</body>
</html>
