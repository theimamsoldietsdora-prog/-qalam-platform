<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QAIM Platform - المنصة العالمية الأولى</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000000; color: #ffffff; overflow: hidden; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 60px; }
        .page.active { display: block; }

        /* شاشة البداية المطابقة تماماً لتيك توك */
        #splashScreen { position: fixed; inset: 0; background: #000000; z-index: 6000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .tiktok-logo-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .tiktok-logo-icon { font-size: 65px; filter: drop-shadow(0 0 20px rgba(37, 244, 238, 0.5)); }
        .tiktok-logo-text { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px; }

        /* الهيدر العلوي */
        .top-tiktok-header { position: absolute; top: 12px; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .top-nav-tabs { display: flex; gap: 18px; font-size: 15px; color: rgba(255,255,255,0.6); font-weight: bold; cursor: pointer; }
        .top-nav-tabs span.active { color: #ffffff; font-size: 16px; font-weight: 900; border-bottom: 3px solid #fff; padding-bottom: 2px; }

        /* الخلاصة الرئيسية (Feed) */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
        .card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: #000; overflow: hidden; }
        .card-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 15%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.3) 100%); z-index: 1; }
        .card-content { position: relative; z-index: 2; margin-bottom: 70px; }

        /* أزرار التفاعل الجانبية (تيك توك ستايل) */
        .side-actions { position: absolute; left: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 16px; z-index: 3; align-items: center; }
        .action-btn { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: none; width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .action-btn:active { transform: scale(0.85); }
        .action-btn.liked { color: #ef4444; background: rgba(239, 68, 68, 0.3); }
        .action-text { font-size: 10px; margin-top: 2px; color: #fff; font-weight: bold; }

        /* الملف الشخصي والتبويبات الملونة */
        .profile-container { padding: 15px; background: #000; }
        .profile-tabs-nav { display: flex; justify-content: space-around; border-bottom: 1px solid #1f2937; padding-bottom: 8px; margin-top: 15px; }
        .profile-tab-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px 12px; position: relative; }
        .profile-tab-btn.active::after { content: ''; position: absolute; bottom: -9px; left: 15%; right: 15%; height: 2px; background: #ffffff; }

        .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 5px; }
        .profile-grid-item { position: relative; height: 155px; background: #111; overflow: hidden; cursor: pointer; }
        .profile-grid-item img, .profile-grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .delete-post-btn { position: absolute; top: 6px; right: 6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 5; display: none; }
        body.selecting-mode .delete-post-btn { display: flex; }

        /* استوديو إعداد المنشور قبل النشر (مثل تيك توك) */
        #postEditorModal, #uploadModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
        .form-input { width: 100%; padding: 10px; background: #0b1120; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .primary-btn { background: #38bdf8; color: #0b1120; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        /* الشريط السفلي (تيك توك ستايل) */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000000; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: #a1a1aa; background: none; border: none; font-size: 8.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; }
        .nav-item.active { color: #ffffff; font-weight: bold; }
        .nav-icon { font-size: 17px; }
        .tiktok-plus-btn { width: 38px; height: 25px; background: #ffffff; border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .tiktok-plus-btn::before { content: ''; position: absolute; left: -3px; width: 38px; height: 25px; background: #25f4ee; border-radius: 8px; z-index: -1; }
        .tiktok-plus-btn::after { content: ''; position: absolute; right: -3px; width: 38px; height: 25px; background: #fe2c55; border-radius: 8px; z-index: -2; }
    </style>
</head>
<body>

    <!-- شاشة البداية المطابقة لتيك توك -->
    <div id="splashScreen">
        <div class="tiktok-logo-box">
            <div class="tiktok-logo-icon">⚔️</div>
            <div class="tiktok-logo-text">QAIM</div>
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="page-home" class="page active">
        <div class="top-tiktok-header">
            <div style="font-size: 12px; color:#ef4444; font-weight:bold; cursor:pointer;" onclick="alert('غرفة البث المباشر نشطة.')">🔴 LIVE</div>
            <div class="top-nav-tabs">
                <span onclick="switchTab(this)">المجتمع</span>
                <span onclick="switchTab(this)">أتابعه</span>
                <span class="active" onclick="switchTab(this)">لك</span>
            </div>
            <span onclick="switchPage('explore')" style="font-size:18px; cursor:pointer;">🔍</span>
        </div>
        <div class="feed" id="mainFeedContainer"></div>
    </div>

    <!-- الإكسبلور -->
    <div id="page-explore" class="page">
        <div style="padding: 20px;">
            <h3 style="color:#38bdf8; margin-bottom:10px;">🔍 الإكسبلور والبحث</h3>
            <input type="text" class="form-input" placeholder="ابحث في المنصة..." onkeyup="searchPosts(this.value)">
            <div id="exploreResults" style="margin-top:15px; display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <!-- الملف الشخصي -->
    <div id="page-profile" class="page">
        <div class="profile-container">
            <div style="text-align: center; margin-top: 20px;">
                <div style="width: 75px; height: 75px; background: #38bdf8; color:#000; border-radius: 50%; margin: 0 auto 10px; display:flex; justify-content:center; align-items:center; font-size:26px; font-weight:bold;">👤</div>
                <h3 id="profileNameDisplay">حيدر حميد محمد ال عگاب</h3>
                <p style="font-size: 11px; color: #94a3b8;">@qaim_founder</p>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; padding: 0 5px;">
                <span style="font-size: 12px; color: #94a3b8;">إدارة المنشورات:</span>
                <button onclick="document.body.classList.toggle('selecting-mode')" class="primary-btn" style="width:auto; padding:4px 10px; font-size:10px; background:#1e293b; color:#38bdf8;">إدارة للحذف 🗑️</button>
            </div>

            <div class="profile-tabs-nav">
                <button class="profile-tab-btn active" style="color:#eab308;" onclick="switchColoredTab('yellow', this)">📊</button>
                <button class="profile-tab-btn" style="color:#ef4444;" onclick="switchColoredTab('red', this)">🔄</button>
                <button class="profile-tab-btn" style="color:#22c55e;" onclick="switchColoredTab('green', this)">📑</button>
                <button class="profile-tab-btn" style="color:#38bdf8;" onclick="switchColoredTab('blue', this)">❤️</button>
            </div>

            <div class="profile-grid" id="profileGridContainer"></div>
        </div>
    </div>

    <!-- استوديو إعداد المنشور قبل النشر (مثل تيك توك Studio) -->
    <div id="postEditorModal">
        <div class="modal-box">
            <h3 style="color:#38bdf8; font-size:14px; text-align:center;">✨ إعداد المنشور وتعديله</h3>
            <div id="editorPreview" style="height:150px; background:#000; border-radius:8px; overflow:hidden;"></div>
            <input type="text" id="editorCaption" class="form-input" placeholder="اكتب وصفاً أو هاشتاغ #المنهج_القويم ...">
            <select id="editorMusicSelect" class="form-input">
                <option value="تلاوة خاشعة - ترند">🎵 صوت ترند: تلاوة خاشعة</option>
                <option value="أهزوجة حماسية">🎶 صوت ترند: أهزوجة حماسية</option>
            </select>
            <button class="primary-btn" onclick="publishPostNow()" style="background:#fe2c55; color:white;">نشر الآن للعام 🚀</button>
            <button onclick="document.getElementById('postEditorModal').style.display='none'" style="background:none; border:none; color:#ef4444; font-size:11px; cursor:pointer; text-align:center;">إلغاء</button>
        </div>
    </div>

    <!-- رفع الوسائط -->
    <input type="file" id="deviceFilePicker" accept="image/*,video/*" style="display:none;" onchange="handleFileSelected(this)">

    <!-- الشريط السفلي (تيك توك ستايل) -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchPage('home', this)"><span class="nav-icon">🏠</span><span>الرئيسية</span></button>
        <button class="nav-item" onclick="switchPage('explore', this)"><span class="nav-icon">🔍</span><span>إكسبلور</span></button>
        <div class="tiktok-plus-btn" onclick="document.getElementById('deviceFilePicker').click()"><span style="color:#000; font-weight:bold; font-size:16px;">+</span></div>
        <button class="nav-item" onclick="switchPage('inbox', this)"><span class="nav-icon">💬</span><span>الوارد</span></button>
        <button class="nav-item" onclick="switchPage('profile', this)"><span class="nav-icon">👤</span><span>الملف الشخصي</span></button>
    </nav>

    <script>
        let posts = [
            { id: 1, user: "بغداد لايف", title: "انطلاق منصة المنهج القويم ⚔️", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", type: "video" }
        ];
        let tempMedia = null;

        window.onload = function() {
            setTimeout(() => {
                let splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 1200);

            let saved = localStorage.getItem('qaim_tiktok_exact');
            if(saved) { try { posts = JSON.parse(saved); } catch(e){} }
            renderFeed();
            renderProfile();
        };

        function renderFeed() {
            let container = document.getElementById('mainFeedContainer');
            container.innerHTML = '';
            posts.forEach(p => {
                let card = document.createElement('div');
                card.className = 'card';
                let mediaTag = p.type === 'image' ? `<img class="card-media" src="${p.url}">` : `<video class="card-media" src="${p.url}" autoplay loop muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>`;
                card.innerHTML = `
                    ${mediaTag}
                    <div class="card-overlay"></div>
                    <div class="side-actions">
                        <button class="action-btn" onclick="this.classList.toggle('liked')">❤️<span class="action-text">12k</span></button>
                        <button class="action-btn" onclick="alert('تم المشاركة بنجاح!')">🚀<span class="action-text">مشاركة</span></button>
                    </div>
                    <div class="card-content">
                        <h4 style="font-size:15px; font-weight:bold;">@${p.user}</h4>
                        <p style="font-size:12px; color:#e2e8f0; margin-top:4px;">${p.title}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleFileSelected(input) {
            if(input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    tempMedia = { url: e.target.result, type: file.type.includes('video') ? 'video' : 'image' };
                    let prev = document.getElementById('editorPreview');
                    prev.innerHTML = tempMedia.type === 'image' ? `<img src="${tempMedia.url}" style="width:100%;height:100%;object-fit:cover;">` : `<video src="${tempMedia.url}" style="width:100%;height:100%;object-fit:cover;" autoplay muted></video>`;
                    document.getElementById('postEditorModal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function publishPostNow() {
            let caption = document.getElementById('editorCaption').value.trim() || "منشور عام جديد ✨";
            let music = document.getElementById('editorMusicSelect').value;
            let newPost = { id: Date.now(), user: "حيدر_العگاب", title: caption + " (" + music + ")", url: tempMedia.url, type: tempMedia.type };
            posts.unshift(newPost);
            localStorage.setItem('qaim_tiktok_exact', JSON.stringify(posts));
            document.getElementById('postEditorModal').style.display = 'none';
            renderFeed();
            renderProfile();
            switchPage('home');
            alert('تم نشر المحتوى بنجاح ليظهر للعام في تيك توك QAIM!');
        }

        function renderProfile() {
            let grid = document.getElementById('profileGridContainer');
            grid.innerHTML = '';
            posts.forEach(p => {
                let item = document.createElement('div');
                item.className = 'profile-grid-item';
                let mediaContent = p.type === 'image' ? `<img src="${p.url}">` : `<img src="https://images.unsplash.com/photo-1542816417-0983cbe82752?auto=format&fit=crop&w=300&q=80">`;
                item.innerHTML = `
                    ${mediaContent}
                    <button class="delete-post-btn" onclick="deletePost(${p.id})">✕</button>
                    <div style="position:absolute; bottom:6px; right:6px; font-size:10px; color:#fff; font-weight:bold; text-shadow:0 1px 3px #000;">⭐ ${p.title}</div>
                `;
                grid.appendChild(item);
            });
        }

        function deletePost(id) {
            if(confirm('هل تريد مسح هذا المنشور نهائياً؟')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('qaim_tiktok_exact', JSON.stringify(posts));
                renderFeed();
                renderProfile();
                alert('تم الحذف بنجاح!');
            }
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(btn) btn.classList.add('active');
            if(pageId === 'profile') renderProfile();
        }

        function switchTab(el) {
            document.querySelectorAll('.top-nav-tabs span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            renderFeed();
        }

        function switchColoredTab(color, btn) {
            document.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProfile();
        }

        function searchPosts(q) {
            let res = document.getElementById('exploreResults');
            res.innerHTML = '';
            let filtered = posts.filter(p => p.title.includes(q) || p.user.includes(q));
            filtered.forEach(p => {
                let div = document.createElement('div');
                div.style.padding = "10px"; div.style.background = "#1e293b"; div.style.borderRadius = "8px"; div.style.fontSize = "12px";
                div.innerHTML = `<b>@${p.user}</b>: ${p.title}`;
                res.appendChild(div);
            });
        }
    </script>
</body>
</html>
