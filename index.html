<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QAIM - منصة المنهج القويم</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .splash-logo { font-size: 42px; font-weight: 900; color: #38bdf8; letter-spacing: 2px; }

        .page { display: none; height: 100dvh; overflow-y: auto; padding-bottom: 75px; }
        .page.active { display: block; }

        .top-bar { position: absolute; top: env(safe-area-inset-top, 10px); left: 0; right: 0; height: 50px; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); }
        .top-tabs { display: flex; gap: 15px; font-size: 15px; font-weight: bold; color: rgba(255,255,255,0.6); }
        .top-tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 2px; cursor: pointer; }
        .top-tab { cursor: pointer; }
        .live-btn { background: #fe2c55; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; }

        .feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .card { height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 15px calc(90px + env(safe-area-inset-bottom, 15px)); background-size: cover; background-position: center; overflow: hidden; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 20%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.3) 100%); z-index: 1; }

        .card-content { position: relative; z-index: 10; max-width: 70%; padding-bottom: 5px; }
        .username-text { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 6px; }
        .title-text { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
        .desc-text { font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.3; }

        .side-actions { position: absolute; left: 15px; bottom: calc(100px + env(safe-area-inset-bottom, 15px)); display: flex; flex-direction: column; gap: 14px; z-index: 20; align-items: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .action-btn { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); border: none; width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.85); }
        .action-text { font-size: 11px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .delete-btn { background: rgba(254, 44, 85, 0.3); border: 1px solid #fe2c55; color: #fe2c55; }

        #toastBox { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(18, 22, 36, 0.95); border: 1px solid #38bdf8; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 12px; z-index: 10000; display: none; backdrop-filter: blur(10px); }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom, 0px)); background: #000; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; z-index: 100; direction: rtl; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; gap: 3px; border: none; background: none; width: 20%; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .tiktok-plus-btn { width: 45px; height: 28px; background: linear-gradient(90deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="toastBox"></div>

    <div id="splashScreen">
        <div class="splash-logo">QAIM</div>
        <div style="font-size: 12px; color: #888; margin-top: 8px;">منصة المنهج القويم</div>
    </div>

    <div id="page-home" class="page active">
        <div class="top-bar">
            <button class="live-btn">LIVE 🔴</button>
            <div class="top-tabs">
                <span class="top-tab">أتابعه</span>
                <span class="top-tab active">لَكْ</span>
                <span class="top-tab" style="color: #38bdf8;">📚 المكتبة</span>
            </div>
            <button style="background:none; border:none; color:#fff; font-size:18px;">🔍</button>
        </div>
        <div class="feed" id="mainFeedContainer">
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=800&q=80')">
                <div class="card-overlay"></div>
                <div class="side-actions">
                    <div class="action-item"><button class="action-btn">❤️</button><span class="action-text">5637</span></div>
                    <div class="action-item"><button class="action-btn">💬</button><span class="action-text">12</span></div>
                    <div class="action-item"><button class="action-btn delete-btn" onclick="showToast('تم الحذف بنجاح')">🗑️</button><span class="action-text">حذف</span></div>
                </div>
                <div class="card-content">
                    <div class="username-text">@qaim_admin</div>
                    <div class="title-text">المنشور الأول في منصة المنهج القويم</div>
                    <div class="desc-text">مرحباً بكم جميعاً في المنصة الرقمية المتكاملة.</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active"><span style="font-size:18px;">🏠</span><span>الرئيسية</span></button>
        <button class="nav-item"><span style="font-size:18px;">👥</span><span>الأصدقاء</span></button>
        <div class="tiktok-plus-btn" onclick="showToast('اختر ملف الفيديو أو الصورة')">+</div>
        <button class="nav-item"><span style="font-size:18px;">💬</span><span>الوار</span></button>
        <button class="nav-item"><span style="font-size:18px;">👤</span><span>الملف</span></button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.log(err));
            });
        }

        setTimeout(() => {
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 500);
        }, 1000);

        function showToast(msg) {
            const box = document.getElementById('toastBox');
            box.innerText = msg;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 2500);
        }
    </script>
</body>
</html>
