<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QAIM - منصة المنهج القويم</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

        /* شاشة البداية */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .splash-logo { font-size: 42px; font-weight: 900; color: #38bdf8; letter-spacing: 2px; }

        .page { display: none; height: 100dvh; overflow-y: auto; padding-bottom: 75px; }
        .page.active { display: block; }

        /* الشريط العلوي */
        .top-bar { position: absolute; top: env(safe-area-inset-top, 10px); left: 0; right: 0; height: 50px; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); }
        .top-tabs { display: flex; gap: 15px; font-size: 15px; font-weight: bold; color: rgba(255,255,255,0.6); }
        .top-tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 2px; }
        .live-btn { background: #fe2c55; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; border: none; }

        /* الشاشة الرئيسية - الفييد */
        .feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .card { height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 15px calc(75px + env(safe-area-inset-bottom, 10px)); background-size: cover; background-position: center; overflow: hidden; }
        
        /* خلفيات مشغل الفيديو والصور */
        .card-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 15%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.4) 100%); z-index: 1; }

        /* المحتوى السفلي للعنوان والوصف */
        .card-content { position: relative; z-index: 10; max-width: 80%; padding-bottom: 10px; }
        .username-text { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 6px; }
        .title-text { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
        .desc-text { font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.3; }

        /* الشريط الجانبي الأيمن للأيقونات (منفصل لمنع التداخل) */
        .side-actions { position: absolute; right: 12px; bottom: calc(85px + env(safe-area-inset-bottom, 10px)); display: flex; flex-direction: column; gap: 16px; z-index: 20; align-items: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .action-btn { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px); border: none; width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer; }
        .action-text { font-size: 11px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .follow-avatar { position: relative; margin-bottom: 6px; }
        .avatar-img { width: 48px; height: 48px; border-radius: 50%; background: #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; border: 2px solid #fff; font-size: 18px; }
        .follow-plus { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #fe2c55; color: #fff; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 2px solid #000; }

        /* القرص الدوار */
        .audio-disc-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 20px; margin-top: 8px; width: fit-content; }
        .disc-icon { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #fe2c55); color: white; display: flex; justify-content: center; align-items: center; font-size: 8px; animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* الشريط السفلي للتنقل */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom, 0px)); background: #000; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; z-index: 100; direction: rtl; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; gap: 3px; border: none; background: none; width: 20%; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .nav-icon { font-size: 18px; }
        
        .tiktok-plus-btn { width: 45px; height: 28px; background: linear-gradient(90deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 20px; cursor: pointer; }

        /* نوافذ الحوار */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: #121624; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .form-input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
        .primary-btn { background: #fe2c55; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="splashScreen">
        <div class="splash-logo">QAIM</div>
        <div style="font-size: 12px; color: #888; margin-top: 8px;">منصة المنهج القويم</div>
    </div>

    <!-- 1. الرئيسية -->
    <div id="page-home" class="page active">
        <div class="top-bar">
            <button class="live-btn" onclick="switchPage('live', document.querySelectorAll('.nav-item')[0])">LIVE</button>
            <div class="top-tabs">
                <span class="top-tab" onclick="alert('تبويب أتابعه')">أتابعه</span>
                <span class="top-tab" onclick="alert('تبويب المجتمع')">المجتمع</span>
                <span class="top-tab active" onclick="alert('تبويب لك')">لَكْ</span>
            </div>
            <button style="background:none; border:none; color:#fff; font-size:18px;" onclick="alert('البحث')">🔍</button>
        </div>

        <div class="feed" id="mainFeedContainer">
            <!-- سيتم توليد العناصر هنا بدون أي تداخل -->
        </div>
    </div>

    <!-- 2. الأصدقاء -->
    <div id="page-friends" class="page" style="padding: 20px; padding-top: 70px;">
        <h2>👥 الأصدقاء</h2>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">منشورات المتابعين والأصدقاء يظهرون هنا.</p>
    </div>

    <!-- 3. صندوق الوارد -->
    <div id="page-inbox" class="page" style="padding: 20px; padding-top: 70px;">
        <h2>💬 صندوق الوارد</h2>
        <div style="margin-top: 15px; background: #111; padding: 12px; border-radius: 10px; font-size: 12px;">
            لا توجد رسائل جديدة حالياً.
        </div>
    </div>

    <!-- 4. البث المباشر -->
    <div id="page-live" class="page" style="background: #000; padding: 20px; padding-top: 70px; text-align: center;">
        <h2 style="color: #fe2c55;">🔴 البث المباشر</h2>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">اضغط لبدء تهيئة البث والتأكد من الكاميرا.</p>
        <button class="primary-btn" style="margin-top: 20px;" onclick="alert('تفعيل الكاميرا للبث المباشر...')">تفعيل الكاميرا 🎥</button>
    </div>

    <!-- 5. الملف الشخصي -->
    <div id="page-profile" class="page" style="padding: 20px; padding-top: 70px; text-align: center;">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #38bdf8; color: #000; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">👤</div>
        <h3>زائر QAIM</h3>
        <p style="font-size: 12px; color: #888; margin-top: 4px;">@guest</p>
        
        <div style="display: flex; justify-content: space-around; margin-top: 20px; background: #111; padding: 15px; border-radius: 12px;">
            <div><h4>0</h4><span style="font-size: 10px; color: #888;">الإعجابات</span></div>
            <div><h4>142</h4><span style="font-size: 10px; color: #888;">المتابعون</span></div>
            <div><h4>85</h4><span style="font-size: 10px; color: #888;">أتابعهم</span></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchPage('home', this)"><span class="nav-icon">🏠</span><span>الصفحة الرئيسية</span></button>
        <button class="nav-item" onclick="switchPage('friends', this)"><span class="nav-icon">👥</span><span>الأصدقاء</span></button>
        <div class="tiktok-plus-btn" onclick="alert('نافذة النشر المباشرة')">+</div>
        <button class="nav-item" onclick="switchPage('inbox', this)"><span class="nav-icon">💬</span><span>صندوق الوارد</span></button>
        <button class="nav-item" onclick="switchPage('profile', this)"><span class="nav-icon">👤</span><span>الملف الشخصي</span></button>
    </nav>

    <script>
        setTimeout(() => {
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 500);
        }, 1500);

        const items = [
            { id: 1, user: 'حيدر ال عگاب', title: 'البلاغ الأول لمنصة المنهج القويم', desc: 'منبر فكري وعلمي لنشر العلوم الحقة.', likes: '5637', comments: '316', saves: '211', shares: '1064', bg: 'https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=800&q=80', audio: 'صوت الفيديو الأصلي' },
            { id: 2, user: 'خادم القرآن', title: 'تلاوة خاشعة - سورة الرحمن', desc: '«فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ»', likes: '890', comments: '45', saves: '98', shares: '120', bg: 'https://images.unsplash.com/photo-1542816417-0983cbe82752?auto=format&fit=crop&w=800&q=80', audio: 'تلاوة سورة الفاتحة - الشيخ عبد الباسط' }
        ];

        function loadFeed() {
            const container = document.getElementById('mainFeedContainer');
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundImage = `url('${item.bg}')`;
                card.innerHTML = `
                    <div class="card-overlay"></div>
                    
                    <div class="side-actions">
                        <div class="follow-avatar">
                            <div class="avatar-img">${item.user.charAt(0)}</div>
                            <div class="follow-plus">+</div>
                        </div>
                        <div class="action-item">
                            <button class="action-btn" onclick="this.style.color='#fe2c55'">❤️</button>
                            <span class="action-text">${item.likes}</span>
                        </div>
                        <div class="action-item">
                            <button class="action-btn" onclick="alert('فتح التعليقات')">💬</button>
                            <span class="action-text">${item.comments}</span>
                        </div>
                        <div class="action-item">
                            <button class="action-btn" onclick="this.style.color='#fe2c55'">🔖</button>
                            <span class="action-text">${item.saves}</span>
                        </div>
                        <div class="action-item">
                            <button class="action-btn" onclick="alert('مشاركة المنشور')">↗️</button>
                            <span class="action-text">${item.shares}</span>
                        </div>
                    </div>

                    <div class="card-content">
                        <div class="username-text">@${item.user}</div>
                        <div class="title-text">${item.title}</div>
                        <div class="desc-text">${item.desc}</div>
                        <div class="audio-disc-badge">
                            <div class="disc-icon">🎵</div>
                            <span style="font-size: 10px;">${item.audio}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        window.onload = loadFeed;
    </script>
</body>
</html>
